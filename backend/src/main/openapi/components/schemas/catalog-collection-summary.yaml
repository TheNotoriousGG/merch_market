type: object
description: Public collection reference assigned to a product.
required:
  - id
  - slug
  - name
properties:
  id:
    type: string
    format: uuid
  slug:
    type: string
    pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
    maxLength: 120
  name:
    type: string
    minLength: 1
    maxLength: 160
