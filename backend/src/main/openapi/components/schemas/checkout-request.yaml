type: object
required: [cartVersion, email, recipientName, phone, postalCode, city, street]
properties:
  cartVersion: {type: integer, format: int64, minimum: 0}
  email: {type: string, format: email, maxLength: 320}
  recipientName: {type: string, minLength: 1, maxLength: 160}
  phone: {type: string, pattern: '^\+[1-9][0-9]{7,14}$'}
  postalCode: {type: string, minLength: 1, maxLength: 20}
  city: {type: string, minLength: 1, maxLength: 120}
  street: {type: string, minLength: 1, maxLength: 240}
  apartment: {type: string, maxLength: 40}
