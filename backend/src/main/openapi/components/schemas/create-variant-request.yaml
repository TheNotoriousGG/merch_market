type: object
additionalProperties: false
required: [sku, label, displayOrder, attributes]
properties:
  sku: {type: string, pattern: '^[A-Z0-9]+(?:-[A-Z0-9]+)*$', maxLength: 64}
  label: {type: string, minLength: 1, maxLength: 160}
  displayOrder: {type: integer, format: int32, minimum: 0}
  attributes:
    type: array
    minItems: 1
    items: {$ref: catalog-attribute-value.yaml}
