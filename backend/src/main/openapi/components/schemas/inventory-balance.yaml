type: object
description: Exact administrative balance for the configured warehouse and one catalog variant.
required: [warehouseCode, variantId, onHand, reserved, available, version, updatedAt]
properties:
  warehouseCode: {type: string, pattern: '^[A-Z][A-Z0-9_]{1,31}$'}
  variantId: {type: string, format: uuid}
  onHand: {type: integer, format: int64, minimum: 0}
  reserved: {type: integer, format: int64, minimum: 0}
  available: {type: integer, format: int64, minimum: 0}
  version: {type: integer, format: int64, minimum: 0}
  updatedAt: {type: string, format: date-time}
