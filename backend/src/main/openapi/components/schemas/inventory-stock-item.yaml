type: object
required: [productId, productName, productStatus, variantId, sku, variantLabel, onHand, reserved, available, version]
properties:
  productId: {type: string, format: uuid}
  productName: {type: string}
  productStatus: {type: string, enum: [DRAFT, ACTIVE]}
  variantId: {type: string, format: uuid}
  sku: {type: string}
  variantLabel: {type: string}
  onHand: {type: integer, format: int64, minimum: 0}
  reserved: {type: integer, format: int64, minimum: 0}
  available: {type: integer, format: int64, minimum: 0}
  version: {type: integer, format: int64, minimum: 0}
  updatedAt: {type: string, format: date-time, nullable: true}
