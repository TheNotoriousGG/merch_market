type: object
description: Metadata for stable page/size pagination with an exact total.
required:
  - page
  - size
  - totalElements
  - totalPages
properties:
  page:
    type: integer
    format: int32
    minimum: 0
  size:
    type: integer
    format: int32
    minimum: 1
    maximum: 100
  totalElements:
    type: integer
    format: int64
    minimum: 0
  totalPages:
    type: integer
    format: int32
    minimum: 0
