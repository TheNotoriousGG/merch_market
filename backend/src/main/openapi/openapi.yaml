openapi: 3.0.3
info:
  title: Amra Merch Market API
  version: 1.0.0
  description: Contract-first API for Amra Shop.
  contact:
    name: Amra Shop engineering
servers:
  - url: /api/v1
    description: Version 1 API
tags:
  - name: Platform
    description: API discovery and platform metadata.
  - name: Identity
    description: Browser session and authenticated identity metadata.
  - name: Catalog
    description: Public storefront navigation and published product discovery.
  - name: Catalog administration
    description: MFA-protected catalog authoring commands for authorized employees.
  - name: Inventory
    description: Public batch availability without exact stock disclosure.
  - name: Inventory administration
    description: MFA-protected warehouse balance and stock movement commands.
  - name: Storefront
    description: Public storefront merchandising content.
  - name: Storefront administration
    description: MFA-protected storefront banner authoring.
  - name: Customer
    description: Guest and authenticated profile, favorites and cart flows.
  - name: Ordering
    description: Idempotent customer checkout and immutable order snapshots.
paths:
  /:
    $ref: paths/platform.yaml
  /session:
    $ref: paths/session.yaml
  /customer/context:
    $ref: paths/customer-context.yaml
  /customer/profile:
    $ref: paths/customer-profile.yaml
  /customer/email-verification:
    $ref: paths/customer-email-verification.yaml
  /customer/email-verification/{challengeId}:
    $ref: paths/customer-email-verification-challenge.yaml
  /customer/addresses:
    $ref: paths/customer-addresses.yaml
  /customer/addresses/{resourceId}:
    $ref: paths/customer-address.yaml
  /customer/favorites/{productId}:
    $ref: paths/customer-favorite.yaml
  /customer/cart:
    $ref: paths/customer-cart.yaml
  /customer/cart/items/{variantId}:
    $ref: paths/customer-cart-item.yaml
  /customer/checkout:
    $ref: paths/customer-checkout.yaml
  /customer/orders/{publicNumber}:
    $ref: paths/customer-order.yaml
  /catalog/categories:
    $ref: paths/catalog-categories.yaml
  /catalog/products:
    $ref: paths/catalog-products.yaml
  /catalog/products/{slug}:
    $ref: paths/catalog-product-by-slug.yaml
  /storefront/banners:
    $ref: paths/storefront-banners.yaml
  /admin/storefront/banners:
    $ref: paths/admin-storefront-banners.yaml
  /admin/storefront/banners/{resourceId}:
    $ref: paths/admin-storefront-banner.yaml
  /admin/storefront/banners/{resourceId}/uploads:
    $ref: paths/admin-storefront-banner-uploads.yaml
  /admin/catalog/categories:
    $ref: paths/admin-catalog-categories.yaml
  /admin/catalog/categories/{resourceId}:
    $ref: paths/admin-catalog-category.yaml
  /admin/catalog/products:
    $ref: paths/admin-catalog-products.yaml
  /admin/catalog/products/{resourceId}:
    $ref: paths/admin-catalog-product.yaml
  /admin/catalog/products/{resourceId}/{transition}:
    $ref: paths/admin-catalog-product-transition.yaml
  /admin/catalog/products/{resourceId}/variants:
    $ref: paths/admin-catalog-product-variants.yaml
  /admin/catalog/products/{resourceId}/variants/{variantId}:
    $ref: paths/admin-catalog-product-variant.yaml
  /admin/catalog/products/{resourceId}/media:
    $ref: paths/admin-catalog-product-media.yaml
  /admin/catalog/products/{resourceId}/media/uploads:
    $ref: paths/admin-catalog-product-media-uploads.yaml
  /admin/catalog/products/{resourceId}/media/{mediaId}:
    $ref: paths/admin-catalog-product-media-item.yaml
  /admin/catalog/collections:
    $ref: paths/admin-catalog-collections.yaml
  /admin/catalog/collections/{resourceId}:
    $ref: paths/admin-catalog-collection.yaml
  /admin/catalog/collections/{resourceId}/products:
    $ref: paths/admin-catalog-collection-products.yaml
  /inventory/availability:
    $ref: paths/inventory-availability.yaml
  /admin/inventory/balances/{variantId}:
    $ref: paths/admin-inventory-balance.yaml
  /admin/inventory/balances/{variantId}/receipts:
    $ref: paths/admin-inventory-receipts.yaml
  /admin/inventory/balances/{variantId}/adjustments:
    $ref: paths/admin-inventory-adjustments.yaml
