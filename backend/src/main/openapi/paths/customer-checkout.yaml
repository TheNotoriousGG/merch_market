post:
  tags: [Ordering]
  operationId: checkout
  summary: Revalidates and atomically confirms the current cart as an order.
  parameters:
    - {$ref: ../components/parameters/idempotency-key.yaml}
    - {$ref: ../components/parameters/csrf-token.yaml}
  requestBody:
    required: true
    content:
      application/json:
        schema: {$ref: ../components/schemas/checkout-request.yaml}
  responses:
    '201':
      description: Created or idempotently replayed order.
      content:
        application/json:
          schema: {$ref: ../components/schemas/customer-order.yaml}
    '409': {$ref: ../components/responses/conflict.yaml}
    '412': {$ref: ../components/responses/precondition-failed.yaml}
