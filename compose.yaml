name: amra-merch-market

services:
  postgres:
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    labels:
      ru.amra.project: amra-merch-market
      ru.amra.component: postgres
    environment:
      POSTGRES_DB: amra_market
      POSTGRES_USER: amra_owner
      POSTGRES_PASSWORD: ${AMRA_DB_OWNER_PASSWORD:-amra-owner-local}
      AMRA_MIGRATION_PASSWORD: ${AMRA_DB_MIGRATION_PASSWORD:-amra-migration-local}
      AMRA_RUNTIME_PASSWORD: ${AMRA_DB_PASSWORD:-amra-runtime-local}
    ports: ["${AMRA_POSTGRES_PORT:-5432}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/18/docker
      - ../amra-merch-market-backend/database/bootstrap/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --dbname=amra_market --username=amra_runtime"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  keycloak-db:
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    labels:
      ru.amra.project: amra-merch-market
      ru.amra.component: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${AMRA_KEYCLOAK_DB_PASSWORD:-amra-keycloak-db-local}
    volumes: ["keycloak-db-data:/var/lib/postgresql/18/docker"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --dbname=keycloak --username=keycloak"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0@sha256:0f198be292568439d700cdbfb893e69a6009bb43a94a06a945b1d3d506c76b13
    labels:
      ru.amra.project: amra-merch-market
      ru.amra.component: keycloak
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${AMRA_KEYCLOAK_DB_PASSWORD:-amra-keycloak-db-local}
      KC_HOSTNAME: http://localhost:${AMRA_KEYCLOAK_PORT:-8081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${AMRA_KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${AMRA_KEYCLOAK_ADMIN_PASSWORD:-amra-keycloak-admin-local}
      AMRA_OIDC_CLIENT_SECRET: ${AMRA_OIDC_CLIENT_SECRET:-amra-oidc-local-secret}
    ports: ["${AMRA_KEYCLOAK_PORT:-8081}:8080"]
    volumes:
      - ../amra-merch-market-backend/identity/keycloak/amra-shop-realm.json:/opt/keycloak/data/import/amra-shop-realm.json:ro
    depends_on:
      keycloak-db: {condition: service_healthy}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000;
          printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          grep -q "200 OK" <&3'
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    labels:
      ru.amra.project: amra-merch-market
      ru.amra.component: minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${AMRA_S3_ACCESS_KEY:-amra-local}
      MINIO_ROOT_PASSWORD: ${AMRA_S3_SECRET_KEY:-amra-local-secret}
      MINIO_API_CORS_ALLOW_ORIGIN: ${AMRA_CORS_ALLOWED_ORIGINS:-http://localhost:3001}
    ports:
      - "${AMRA_MINIO_PORT:-9000}:9000"
      - "${AMRA_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/amra-catalog &&
        mc cp --recursive /demo-media/ local/amra-catalog/demo/ &&
        mc anonymous set download local/amra-catalog
    environment:
      MINIO_ROOT_USER: ${AMRA_S3_ACCESS_KEY:-amra-local}
      MINIO_ROOT_PASSWORD: ${AMRA_S3_SECRET_KEY:-amra-local-secret}
    volumes:
      - ./demo-media:/demo-media:ro
    depends_on:
      minio: {condition: service_healthy}
    restart: "no"

  backend:
    image: amra/merch-market-backend:local
    labels:
      ru.amra.project: amra-merch-market
      ru.amra.component: backend
    build:
      context: ../amra-merch-market-backend
      dockerfile: Dockerfile.compose
    environment:
      AMRA_DB_URL: jdbc:postgresql://postgres:5432/amra_market?currentSchema=amra_shop&ApplicationName=amra-merch-market-backend
      AMRA_DB_USER: amra_runtime
      AMRA_DB_PASSWORD: ${AMRA_DB_PASSWORD:-amra-runtime-local}
      AMRA_DB_MIGRATION_URL: jdbc:postgresql://postgres:5432/amra_market?currentSchema=amra_shop&ApplicationName=amra-merch-market-backend-migration
      AMRA_DB_MIGRATION_USER: amra_migrator
      AMRA_DB_MIGRATION_PASSWORD: ${AMRA_DB_MIGRATION_PASSWORD:-amra-migration-local}
      AMRA_OIDC_CLIENT_ID: amra-backend
      AMRA_OIDC_CLIENT_SECRET: ${AMRA_OIDC_CLIENT_SECRET:-amra-oidc-local-secret}
      AMRA_OIDC_AUTHORIZATION_URI: http://localhost:8081/realms/amra-shop/protocol/openid-connect/auth
      AMRA_OIDC_TOKEN_URI: http://keycloak:8080/realms/amra-shop/protocol/openid-connect/token
      AMRA_OIDC_JWK_SET_URI: http://keycloak:8080/realms/amra-shop/protocol/openid-connect/certs
      AMRA_OIDC_USER_INFO_URI: http://keycloak:8080/realms/amra-shop/protocol/openid-connect/userinfo
      AMRA_CORS_ALLOWED_ORIGINS: http://localhost:3001
      AMRA_LOGIN_SUCCESS_URL: http://localhost:3001/admin
      AMRA_SESSION_COOKIE_SECURE: "false"
      AMRA_ADMIN_MFA_ACR_VALUES: "0,1,2"
      AMRA_CUSTOMER_PHONE_AUTH_EXPOSE_DEVELOPMENT_CODE: "true"
      AMRA_S3_ENDPOINT: http://minio:9000
      AMRA_S3_UPLOAD_ENDPOINT: http://localhost:${AMRA_MINIO_PORT:-9000}
      AMRA_S3_ACCESS_KEY: ${AMRA_S3_ACCESS_KEY:-amra-local}
      AMRA_S3_SECRET_KEY: ${AMRA_S3_SECRET_KEY:-amra-local-secret}
      AMRA_S3_REGION: ${AMRA_S3_REGION:-us-east-1}
      AMRA_CATALOG_MEDIA_BASE_URL: http://localhost:9000/amra-catalog/
    ports: ["${AMRA_BACKEND_PORT:-8080}:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      keycloak: {condition: service_healthy}
      minio: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    restart: unless-stopped

  frontend:
    image: amra/merch-market-frontend:local
    labels:
      ru.amra.project: amra-merch-market
      ru.amra.component: frontend
    build:
      context: ../amra-merch-market-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${AMRA_BACKEND_PORT:-8080}/api/v1
    ports: ["${AMRA_FRONTEND_PORT:-3001}:3001"]
    depends_on:
      backend: {condition: service_started}
    restart: unless-stopped

volumes:
  postgres-data: {name: amra-merch-market-postgres-data}
  keycloak-db-data: {name: amra-merch-market-keycloak-postgres-data}
  minio-data: {name: amra-merch-market-minio-data}
