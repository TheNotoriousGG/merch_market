services:
  postgres:
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_DB: amra_market
      POSTGRES_USER: amra_owner
      POSTGRES_PASSWORD: ${AMRA_DB_OWNER_PASSWORD:?Set AMRA_DB_OWNER_PASSWORD}
      AMRA_MIGRATION_PASSWORD: ${AMRA_DB_MIGRATION_PASSWORD:?Set AMRA_DB_MIGRATION_PASSWORD}
      AMRA_RUNTIME_PASSWORD: ${AMRA_DB_PASSWORD:?Set AMRA_DB_PASSWORD}
    ports:
      - "${AMRA_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/18/docker
      - ./database/bootstrap/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --dbname=amra_market --username=amra_runtime"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
