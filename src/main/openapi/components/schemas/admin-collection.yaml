type: object
required: [id, slug, name, description, status, displayOrder, productIds, version]
properties:
  id: {type: string, format: uuid}
  slug: {type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 120}
  name: {type: string, minLength: 1, maxLength: 160}
  description: {type: string, minLength: 1, maxLength: 2000}
  status: {type: string, enum: [ACTIVE, HIDDEN]}
  displayOrder: {type: integer, format: int32, minimum: 0}
  productIds:
    type: array
    items: {type: string, format: uuid}
  version: {type: integer, format: int64, minimum: 0}
