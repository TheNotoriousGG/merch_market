type: object
description: Administrative product variant representation.
required: [id, sku, label, status, displayOrder, attributes, version]
properties:
  id: {type: string, format: uuid}
  sku: {type: string, pattern: '^[A-Z0-9]+(?:-[A-Z0-9]+)*$', maxLength: 64}
  label: {type: string, minLength: 1, maxLength: 160}
  status: {type: string, enum: [ACTIVE, ARCHIVED]}
  displayOrder: {type: integer, format: int32, minimum: 0}
  attributes:
    type: array
    minItems: 1
    items: {$ref: catalog-attribute-value.yaml}
  version: {type: integer, format: int64, minimum: 0}
