type: object
description: Compact published product representation for storefront cards.
required:
  - id
  - slug
  - name
  - shortDescription
  - currency
  - primaryMedia
  - publishedAt
  - variantOptions
properties:
  id:
    type: string
    format: uuid
  slug:
    type: string
    pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
    maxLength: 120
  name:
    type: string
    minLength: 1
    maxLength: 200
  shortDescription:
    type: string
    minLength: 1
    maxLength: 500
  priceMinor:
    type: integer
    format: int64
    minimum: 1
    nullable: true
  newArrival:
    type: boolean
  onSale:
    type: boolean
  salePercent:
    type: integer
    minimum: 1
    maximum: 90
    nullable: true
  featured:
    type: boolean
  currency:
    type: string
    enum: [RUB]
  primaryMedia:
    $ref: catalog-media.yaml
  publishedAt:
    type: string
    format: date-time
  variantOptions:
    type: array
    items:
      $ref: catalog-variant-option.yaml
