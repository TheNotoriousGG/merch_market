get:
  tags: [Catalog administration]
  summary: Read an administrative category
  operationId: getAdminCatalogCategory
  security: [{SessionCookie: []}]
  parameters: [{$ref: ../components/parameters/resource-id.yaml}]
  responses:
    "200":
      description: Administrative category.
      headers:
        ETag: {$ref: ../components/headers/etag.yaml}
        X-Trace-Id: {$ref: ../components/headers/trace-id.yaml}
      content: {application/json: {schema: {$ref: ../components/schemas/admin-category.yaml}}}
    "401": {$ref: ../components/responses/unauthorized.yaml}
    "403": {$ref: ../components/responses/forbidden.yaml}
    "404": {$ref: ../components/responses/not-found.yaml}
    "500": {$ref: ../components/responses/unexpected-error.yaml}
patch:
  tags: [Catalog administration]
  summary: Update, move, show, or hide a category
  description: Requires CATALOG_MANAGER or ADMIN authority and a verified MFA claim.
  operationId: updateCatalogCategory
  security: [{SessionCookie: []}]
  parameters:
    - {$ref: ../components/parameters/resource-id.yaml}
    - {$ref: ../components/parameters/if-match.yaml}
    - {$ref: ../components/parameters/csrf-token.yaml}
  requestBody:
    required: true
    content: {application/json: {schema: {$ref: ../components/schemas/update-category-request.yaml}}}
  responses:
    "200":
      description: Updated category.
      headers:
        ETag: {$ref: ../components/headers/etag.yaml}
        X-Trace-Id: {$ref: ../components/headers/trace-id.yaml}
      content: {application/json: {schema: {$ref: ../components/schemas/admin-category.yaml}}}
    "400": {$ref: ../components/responses/bad-request.yaml}
    "401": {$ref: ../components/responses/unauthorized.yaml}
    "403": {$ref: ../components/responses/forbidden.yaml}
    "404": {$ref: ../components/responses/not-found.yaml}
    "409": {$ref: ../components/responses/conflict.yaml}
    "412": {$ref: ../components/responses/precondition-failed.yaml}
    "428": {$ref: ../components/responses/precondition-required.yaml}
    "500": {$ref: ../components/responses/unexpected-error.yaml}
delete:
  tags: [Catalog administration]
  summary: Permanently delete an unused archived category
  operationId: deleteCatalogCategory
  security: [{SessionCookie: []}]
  parameters:
    - {$ref: ../components/parameters/resource-id.yaml}
    - {$ref: ../components/parameters/if-match.yaml}
    - {$ref: ../components/parameters/csrf-token.yaml}
  responses:
    "204":
      description: Category permanently deleted.
      headers: {X-Trace-Id: {$ref: ../components/headers/trace-id.yaml}}
    "400": {$ref: ../components/responses/bad-request.yaml}
    "401": {$ref: ../components/responses/unauthorized.yaml}
    "403": {$ref: ../components/responses/forbidden.yaml}
    "404": {$ref: ../components/responses/not-found.yaml}
    "409": {$ref: ../components/responses/conflict.yaml}
    "412": {$ref: ../components/responses/precondition-failed.yaml}
    "428": {$ref: ../components/responses/precondition-required.yaml}
    "500": {$ref: ../components/responses/unexpected-error.yaml}
