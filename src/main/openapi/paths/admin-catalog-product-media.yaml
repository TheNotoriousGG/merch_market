post:
  tags: [Catalog administration]
  summary: Attach media metadata to a product
  operationId: createCatalogProductMedia
  security: [{SessionCookie: []}]
  parameters:
    - {$ref: ../components/parameters/resource-id.yaml}
    - {$ref: ../components/parameters/if-match.yaml}
    - {$ref: ../components/parameters/idempotency-key.yaml}
    - {$ref: ../components/parameters/csrf-token.yaml}
  requestBody:
    required: true
    content: {application/json: {schema: {$ref: ../components/schemas/create-media-request.yaml}}}
  responses:
    "201":
      description: Media metadata attached.
      headers:
        ETag: {$ref: ../components/headers/etag.yaml}
        X-Trace-Id: {$ref: ../components/headers/trace-id.yaml}
      content: {application/json: {schema: {$ref: ../components/schemas/admin-media.yaml}}}
    "400": {$ref: ../components/responses/bad-request.yaml}
    "401": {$ref: ../components/responses/unauthorized.yaml}
    "403": {$ref: ../components/responses/forbidden.yaml}
    "404": {$ref: ../components/responses/not-found.yaml}
    "409": {$ref: ../components/responses/conflict.yaml}
    "412": {$ref: ../components/responses/precondition-failed.yaml}
    "428": {$ref: ../components/responses/precondition-required.yaml}
    "500": {$ref: ../components/responses/unexpected-error.yaml}
