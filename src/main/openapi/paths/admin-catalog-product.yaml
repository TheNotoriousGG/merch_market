get:
  tags: [Catalog administration]
  summary: Read an administrative product
  operationId: getAdminCatalogProduct
  security: [{SessionCookie: []}]
  parameters: [{$ref: ../components/parameters/resource-id.yaml}]
  responses:
    "200":
      description: Administrative product.
      headers:
        ETag: {$ref: ../components/headers/etag.yaml}
        X-Trace-Id: {$ref: ../components/headers/trace-id.yaml}
      content: {application/json: {schema: {$ref: ../components/schemas/admin-product.yaml}}}
    "401": {$ref: ../components/responses/unauthorized.yaml}
    "403": {$ref: ../components/responses/forbidden.yaml}
    "404": {$ref: ../components/responses/not-found.yaml}
    "500": {$ref: ../components/responses/unexpected-error.yaml}
patch:
  tags: [Catalog administration]
  summary: Update draft or active product content
  description: Requires CATALOG_MANAGER or ADMIN authority and a verified MFA claim.
  operationId: updateCatalogProduct
  security: [{SessionCookie: []}]
  parameters:
    - {$ref: ../components/parameters/resource-id.yaml}
    - {$ref: ../components/parameters/if-match.yaml}
    - {$ref: ../components/parameters/csrf-token.yaml}
  requestBody:
    required: true
    content: {application/json: {schema: {$ref: ../components/schemas/update-product-request.yaml}}}
  responses:
    "200":
      description: Updated product.
      headers:
        ETag: {$ref: ../components/headers/etag.yaml}
        X-Trace-Id: {$ref: ../components/headers/trace-id.yaml}
      content: {application/json: {schema: {$ref: ../components/schemas/admin-product.yaml}}}
    "400": {$ref: ../components/responses/bad-request.yaml}
    "401": {$ref: ../components/responses/unauthorized.yaml}
    "403": {$ref: ../components/responses/forbidden.yaml}
    "404": {$ref: ../components/responses/not-found.yaml}
    "409": {$ref: ../components/responses/conflict.yaml}
    "412": {$ref: ../components/responses/precondition-failed.yaml}
    "428": {$ref: ../components/responses/precondition-required.yaml}
    "500": {$ref: ../components/responses/unexpected-error.yaml}
delete:
  tags: [Catalog administration]
  summary: Permanently delete an archived product
  operationId: deleteCatalogProduct
  security: [{SessionCookie: []}]
  parameters:
    - {$ref: ../components/parameters/resource-id.yaml}
    - {$ref: ../components/parameters/if-match.yaml}
    - {$ref: ../components/parameters/csrf-token.yaml}
  responses:
    "204": {description: Product permanently deleted.}
    "401": {$ref: ../components/responses/unauthorized.yaml}
    "403": {$ref: ../components/responses/forbidden.yaml}
    "404": {$ref: ../components/responses/not-found.yaml}
    "409": {$ref: ../components/responses/conflict.yaml}
    "412": {$ref: ../components/responses/precondition-failed.yaml}
    "428": {$ref: ../components/responses/precondition-required.yaml}
    "500": {$ref: ../components/responses/unexpected-error.yaml}
